[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deauth-correlator"
version = "1.2.0"
description = "Read-only forensic correlation of wireless-disruption events with security-camera events"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["forensics", "802.11", "deauthentication", "opnsense", "onvif", "evidence"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
# scipy supplies the reference implementations of the significance tests. The
# tool falls back to exact pure-Python versions without it, so it is optional.
stats = ["scipy>=1.10"]
# Camera integration: requests for ONVIF, OpenCV for RTSP snapshots.
camera = ["requests>=2.28", "opencv-python>=4.8"]
all = ["scipy>=1.10", "requests>=2.28", "opencv-python>=4.8"]

[project.scripts]
deauth-correlator = "deauth_correlator.cli:main"

[project.gui-scripts]
deauth-correlator-gui = "deauth_correlator.gui.app:launch"

[tool.setuptools.packages.find]
include = ["deauth_correlator*"]

